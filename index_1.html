<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Šahovski kviz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2420;
    --bg-alt: #212C26;
    --square-dark: #26332B;
    --square-light: #2E3D33;
    --ivory: #EDE6D6;
    --ivory-dim: #B9B2A2;
    --gold: #B08D57;
    --gold-bright: #D4AF6A;
    --brick: #9A4B3F;
    --line: #3A473E;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ivory);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
  }

  body{
    background-image:
      linear-gradient(45deg, var(--square-dark) 25%, transparent 25%),
      linear-gradient(-45deg, var(--square-dark) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--square-dark) 75%),
      linear-gradient(-45deg, transparent 75%, var(--square-dark) 75%);
    background-size: 64px 64px;
    background-position: 0 0, 0 32px, 32px -32px, -32px 0px;
    background-attachment: fixed;
  }

  .veil{
    min-height: 100vh;
    background: linear-gradient(180deg, rgba(27,36,32,0.94), rgba(27,36,32,0.97));
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 48px 20px 80px;
  }

  header{
    width:100%;
    max-width: 640px;
    margin-bottom: 28px;
  }

  .coord{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--gold);
  }

  h1{
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 700;
    margin: 6px 0 4px;
    line-height: 1.15;
  }

  .subtitle{
    color: var(--ivory-dim);
    font-size: 16px;
    margin: 0;
    max-width: 46ch;
  }

  main{
    width: 100%;
    max-width: 640px;
  }

  /* progress: 8 files, a-h, like a rank of squares */
  .files{
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin: 28px 0 32px;
  }
  .file-sq{
    height: 8px;
    background: var(--square-dark);
    border: 1px solid var(--line);
  }
  .file-sq.done{
    background: var(--gold);
    border-color: var(--gold);
  }
  .file-sq.current{
    background: var(--ivory);
    border-color: var(--ivory);
  }

  .card{
    background: var(--bg-alt);
    border: 1px solid var(--line);
    padding: 32px 28px;
  }

  .qmeta{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    display:flex;
    justify-content: space-between;
    margin-bottom: 18px;
    letter-spacing: 0.03em;
  }

  .question{
    font-size: 21px;
    line-height: 1.4;
    margin: 0 0 26px;
    font-weight: 600;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .opt{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ivory);
    padding: 14px 16px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 16px;
    text-align:left;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .opt:hover:not(:disabled){
    border-color: var(--gold);
  }
  .opt:disabled{ cursor: default; }

  .opt .tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ivory-dim);
    border: 1px solid var(--line);
    width: 22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  .opt.correct{
    border-color: var(--gold-bright);
    background: rgba(176,141,87,0.15);
  }
  .opt.correct .tag{
    background: var(--gold-bright);
    color: var(--bg);
    border-color: var(--gold-bright);
  }

  .opt.wrong{
    border-color: var(--brick);
    background: rgba(154,75,63,0.15);
  }
  .opt.wrong .tag{
    background: var(--brick);
    color: var(--ivory);
    border-color: var(--brick);
  }

  .explain{
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px dashed var(--line);
    font-size: 15px;
    color: var(--ivory-dim);
    line-height: 1.55;
    display:none;
  }
  .explain.show{ display:block; }

  .nav{
    margin-top: 24px;
    display:flex;
    justify-content:flex-end;
  }

  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    background: var(--gold);
    color: var(--bg);
    border: none;
    padding: 12px 22px;
    cursor:pointer;
    display:none;
  }
  .btn.show{ display:inline-block; }
  .btn:hover{ background: var(--gold-bright); }

  /* results */
  .result{
    text-align:center;
  }
  .result .piece{
    font-size: 64px;
    line-height:1;
    margin-bottom: 6px;
  }
  .result h2{
    font-size: 30px;
    margin: 0 0 6px;
  }
  .result p{
    color: var(--ivory-dim);
    font-size: 16px;
    max-width: 44ch;
    margin: 0 auto 26px;
    line-height: 1.5;
  }
  .result .score{
    font-family:'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--gold);
    margin-bottom: 22px;
    letter-spacing: 0.04em;
  }
  .restart{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    background: transparent;
    color: var(--ivory);
    border: 1px solid var(--gold);
    padding: 12px 22px;
    cursor:pointer;
  }
  .restart:hover{ background: rgba(176,141,87,0.15); }

  @media (prefers-reduced-motion: reduce){
    .opt{ transition: none; }
  }
</style>
</head>
<body>
<div class="veil">
  <header>
    <div class="coord">e4 — otvaranje</div>
    <h1>Šahovski kviz</h1>
    <p class="subtitle">Pravila, istorija i partije koje su obeležile igru. 15 pitanja, bez vremenskog ograničenja.</p>
  </header>

  <main>
    <div class="files" id="files"></div>
    <div class="card" id="card"></div>
  </main>
</div>

<script>
const QUESTIONS = [
  {
    q: "Koja figura se jedina može kretati preko drugih figura na tabli?",
    options: ["Top", "Skakač (konj)", "Lovac", "Kraljica"],
    correct: 1,
    explain: "Skakač je jedina figura koja preskače druge, zahvaljujući svom karakterističnom potezu u obliku slova L."
  },
  {
    q: "Kako se zove potez kada kralj i top zamene mesta u jednom potezu?",
    options: ["Rokada", "En passant", "Promocija", "Šah-mat"],
    correct: 0,
    explain: "Rokada je jedini potez u šahu kojim se dve sopstvene figure pomeraju istovremeno."
  },
  {
    q: "Koliko polja ima šahovska tabla?",
    options: ["32", "48", "64", "100"],
    correct: 2,
    explain: "Tabla ima 8x8 polja, ukupno 64, naizmenično svetlih i tamnih."
  },
  {
    q: "Šta se dešava sa pešakom kada stigne do poslednje horizontale?",
    options: ["Vraća se na početak", "Postaje kraljica ili druga figura (promocija)", "Biva uklonjen sa table", "Ništa, ostaje pešak"],
    correct: 1,
    explain: "Pešak koji stigne do suprotnog kraja table se promoviše — najčešće u kraljicu, ali igrač može izabrati i topa, lovca ili skakača."
  },
  {
    q: "Koji specijalni potez pešaka dozvoljava da 'uzme u prolazu' protivnički pešak?",
    options: ["Rokada", "En passant", "Fianketo", "Gambit"],
    correct: 1,
    explain: "En passant se dešava kada protivnički pešak pređe dva polja odjednom pored tvog pešaka, a ti ga možeš uzeti kao da je prešao samo jedno."
  },
  {
    q: "Ko je bio prvi zvanični svetski šampion u šahu?",
    options: ["Emanuel Lasker", "Wilhelm Steinitz", "Jose Raul Capablanca", "Bobby Fischer"],
    correct: 1,
    explain: "Wilhelm Steinitz je 1886. godine postao prvi zvanično priznati svetski šampion, nakon pobede nad Johannesom Zukertortom."
  },
  {
    q: "Koja zemlja je domaćin čuvenog meča Fischer–Spassky iz 1972. godine, poznatog kao 'Meč veka'?",
    options: ["Sovjetski Savez", "Island", "SAD", "Nemačka"],
    correct: 1,
    explain: "Meč je održan u Reykjaviku na Islandu, u jeku Hladnog rata, i privukao je ogromnu svetsku pažnju."
  },
  {
    q: "Koliko poena osvaja igrač za pobedu u standardnom šahovskom bodovanju?",
    options: ["2", "1", "0.5", "3"],
    correct: 1,
    explain: "Pobeda donosi 1 poen, remi 0.5 poena, a poraz 0 poena."
  },
  {
    q: "Ko je bio najmlađi svetski šampion u šahu do dolaska Gukeša Dommaradžua?",
    options: ["Magnus Carlsen", "Garry Kasparov", "Anatolij Karpov", "Vladimir Kramnik"],
    correct: 1,
    explain: "Garry Kasparov je 1985. godine postao svetski šampion sa 22 godine, što je dugo bio rekord."
  },
  {
    q: "Kako se zove otvaranje koje počinje potezima 1.e4 c5?",
    options: ["Francuska odbrana", "Sicilijanska odbrana", "Karo-Kan odbrana", "Škotska partija"],
    correct: 1,
    explain: "Sicilijanska odbrana je jedno od najpopularnijih i najanaliziranijih otvaranja u šahu."
  },
  {
    q: "Šta znači termin 'šah-mat'?",
    options: ["Kralj je zarobljen bez mogućeg izlaza", "Partija je remizirana", "Igrač je izgubio vremena na satu", "Kralj je pomeren van table"],
    correct: 0,
    explain: "Šah-mat znači da je kralj napadnut (u šahu) i da ne postoji nijedan legalan potez kojim bi se taj napad izbegao."
  },
  {
    q: "Koja je razlika između 'pata' (pat) i 'šah-mata'?",
    options: ["Nema razlike", "Pat znači remi jer igrač na potezu nema legalan potez, a kralj mu nije napadnut", "Pat je pobeda jačeg igrača", "Pat se dešava samo u završnicama sa kraljevima"],
    correct: 1,
    explain: "Pat je jedan od načina za remi — igrač na potezu nema nijedan legalan potez, ali njegov kralj u tom trenutku nije napadnut."
  },
  {
    q: "Koji šahovski velemajstor je poznat po autorstvu koncepta 'hipermodernizma' u otvaranjima?",
    options: ["Aron Nimzowitsch", "Paul Morphy", "Mihail Tal", "Boris Spassky"],
    correct: 0,
    explain: "Nimzowitsch je razvio ideje hipermodernizma — kontrolu centra table figurama iz daljine, umesto direktnog zauzimanja pešacima."
  },
  {
    q: "Koliko vremena tipično traje jedna partija u 'brzom šahu' (rapid)?",
    options: ["1–3 minuta po igraču", "10–60 minuta po igraču", "Preko 3 sata po igraču", "Bez vremenskog ograničenja"],
    correct: 1,
    explain: "Rapid šah obično podrazumeva 10 do 60 minuta po igraču za celu partiju, za razliku od klasičnog šaha koji traje i po nekoliko sati."
  },
  {
    q: "Ko drži titulu prvog svetskog šampiona u šahu poreklom iz Indije mlađeg od 18 godina, koji je osvojio titulu 2024. godine?",
    options: ["Viswanathan Anand", "Gukesh Dommaraju", "Arjun Erigaisi", "Praggnanandhaa"],
    correct: 1,
    explain: "Gukesh Dommaraju je 2024. godine, sa 18 godina, postao najmlađi svetski šampion u istoriji, pobedivši Ding Lirena."
  }
];

let current = 0;
let score = 0;
let answered = false;

const cardEl = document.getElementById('card');
const filesEl = document.getElementById('files');

function renderFiles(){
  filesEl.innerHTML = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const sq = document.createElement('div');
    sq.className = 'file-sq';
    if(i < current) sq.classList.add('done');
    else if(i === current) sq.classList.add('current');
    filesEl.appendChild(sq);
  }
}

function letters(i){
  return String.fromCharCode(97+i); // a, b, c...
}

function renderQuestion(){
  answered = false;
  const item = QUESTIONS[current];
  renderFiles();

  const optsHtml = item.options.map((opt, i) => `
    <button class="opt" data-idx="${i}">
      <span class="tag">${letters(i)}</span>
      <span>${opt}</span>
    </button>
  `).join('');

  cardEl.innerHTML = `
    <div class="qmeta">
      <span>pitanje ${current+1} / ${QUESTIONS.length}</span>
      <span>skor: ${score}</span>
    </div>
    <p class="question">${item.q}</p>
    <div class="options">${optsHtml}</div>
    <div class="explain" id="explain">${item.explain}</div>
    <div class="nav"><button class="btn" id="next">${current === QUESTIONS.length-1 ? 'Rezultati →' : 'Sledeće pitanje →'}</button></div>
  `;

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectOption(parseInt(btn.dataset.idx)));
  });
}

function selectOption(idx){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[current];
  const opts = document.querySelectorAll('.opt');

  opts.forEach((btn, i) => {
    btn.disabled = true;
    if(i === item.correct) btn.classList.add('correct');
    else if(i === idx) btn.classList.add('wrong');
  });

  if(idx === item.correct) score++;

  document.getElementById('explain').classList.add('show');
  document.getElementById('next').classList.add('show');
  document.getElementById('next').addEventListener('click', () => {
    current++;
    if(current < QUESTIONS.length) renderQuestion();
    else renderResult();
  });
}

function renderResult(){
  filesEl.innerHTML = '';
  for(let i=0;i<QUESTIONS.length;i++){
    const sq = document.createElement('div');
    sq.className = 'file-sq done';
    filesEl.appendChild(sq);
  }

  const pct = Math.round((score/QUESTIONS.length)*100);
  let piece, title, msg;
  if(pct >= 85){ piece = '♛'; title = 'Velemajstor'; msg = 'Poznaješ tablu iznutra. Malo koje pitanje ti je pobeglo.'; }
  else if(pct >= 60){ piece = '♜'; title = 'Snažan igrač'; msg = 'Solidno poznavanje pravila i istorije — još malo i stižeš do vrha.'; }
  else if(pct >= 35){ piece = '♞'; title = 'Igrač u razvoju'; msg = 'Osnove su tu, ali ima prostora za dalje otvaranje partije.'; }
  else { piece = '♟', title = 'Početnik'; msg = 'Svaki velemajstor je nekad počeo od prvog poteza. Probaj ponovo!'; }

  cardEl.innerHTML = `
    <div class="result">
      <div class="piece">${piece}</div>
      <h2>${title}</h2>
      <p>${msg}</p>
      <div class="score">${score} / ${QUESTIONS.length} tačnih odgovora — ${pct}%</div>
      <button class="restart" id="restart">Igraj ponovo</button>
    </div>
  `;

  document.getElementById('restart').addEventListener('click', () => {
    current = 0; score = 0;
    renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
